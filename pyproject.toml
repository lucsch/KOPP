[project]
name = "kopp"
version = "1.3.0"
description = "track working time, hour balances, annual leave, vacation time"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "numpy==2.5.3",
    "openpyxl>=3.1.5",
    "peewee==4.5.2",
    "pyinstaller==6.22.3",
    "wxpython==4.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
